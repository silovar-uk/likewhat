name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate and lint library data
        run: node scripts/build-pattern-data.mjs
      - name: Verify generated runtime data
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const core=JSON.parse(fs.readFileSync('generated/catalog-core.json'));
          const search=JSON.parse(fs.readFileSync('generated/search-index.json'));
          const meta=JSON.parse(fs.readFileSync('generated/meta.json'));
          const files=fs.readdirSync('generated/patterns').filter(name=>name.endsWith('.json')).length;
          if(core.referenceCount!==files)throw new Error(`core references ${core.referenceCount} != detail files ${files}`);
          if(search.referenceCount!==core.referenceCount)throw new Error('search/core count mismatch');
          if(meta.referenceCount!==core.referenceCount)throw new Error('meta/core count mismatch');
          const ids=core.records.map(r=>r.id);
          if(new Set(ids).size!==ids.length)throw new Error('duplicate pattern ids');
          const searchIds=new Set(search.records.map(r=>r.id));
          if(ids.some(id=>!searchIds.has(id)))throw new Error('search index missing ids');
          for(const record of core.records){
            if(!record.entryKind)throw new Error(`missing entryKind ${record.id}`);
            if(!record.designSpace||!record.detailFile)throw new Error(`incomplete record ${record.id}`);
          }
          console.log('runtime verified:',core.referenceCount,'references');
          console.log('kinds:',meta.kindCounts);
          console.log('scenes:',meta.sceneCounts);
          NODE
      - name: Verify progressive loading contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const indexHtml=fs.readFileSync('index.html','utf8');
          const bootstrap=fs.readFileSync('top-bootstrap.js','utf8');
          if(/<script[^>]+src=["']patterns(?:-|\.)/i.test(indexHtml))throw new Error('TOP HTML directly loads Pattern source');
          if(!bootstrap.includes('generated/catalog-core.json'))throw new Error('TOP bootstrap does not load core catalog');
          if(!bootstrap.includes('generated/search-index.json'))throw new Error('TOP bootstrap cannot defer search index');
          console.log('TOP progressive loading contract verified');
          NODE
      - name: Verify history and collection manifests
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const core=JSON.parse(fs.readFileSync('generated/catalog-core.json'));
          const history=JSON.parse(fs.readFileSync('generated/history/wave3.json'));
          const index=JSON.parse(fs.readFileSync('generated/brands/index.json'));
          if(history.before.length!==63||history.after.length!==78||history.waveIds.length!==15)throw new Error('Wave 3 history changed unexpectedly');
          const eligible=core.records.filter(r=>!['industry-cluster','scene'].includes(r.entryKind));
          const expected=new Set(eligible.map(r=>r.brand));
          if(index.brands.length!==expected.size)throw new Error(`collection count ${index.brands.length} != ${expected.size}`);
          for(const entry of index.brands){
            if(!fs.existsSync(`generated/brands/${entry.file}`))throw new Error(`missing manifest ${entry.file}`);
            if(!entry.route)throw new Error(`missing optimized route for ${entry.brand}`);
          }
          console.log('history and collection manifests verified');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
