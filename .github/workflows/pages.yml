name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate pattern data
        run: node scripts/build-pattern-data.mjs
      - name: Verify generated catalog
        run: |
          test -f generated/catalog.json
          test "$(find generated/patterns -type f -name '*.json' | wc -l)" -eq 104
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('generated/catalog.json'));if(c.referenceCount!==104)process.exit(1);console.log('catalog references:',c.referenceCount)"
      - name: Verify analysis catalog and history
        run: |
          test -f generated/history/wave3.json
          node - <<'NODE'
          const fs=require('fs');
          const catalog=JSON.parse(fs.readFileSync('generated/catalog.json'));
          const history=JSON.parse(fs.readFileSync('generated/history/wave3.json'));
          if(catalog.schemaVersion<2)throw new Error(`catalog schema ${catalog.schemaVersion} is not analysis-ready`);
          if(history.before.length!==63)throw new Error(`Wave 3 before snapshot ${history.before.length} != 63`);
          if(history.after.length!==78)throw new Error(`Wave 3 after snapshot ${history.after.length} != 78`);
          if(history.waveIds.length!==15)throw new Error(`Wave 3 ids ${history.waveIds.length} != 15`);
          for(const record of catalog.records){
            if(!record.id||!record.designSpace||!record.detailFile)throw new Error(`incomplete compact record ${record.id||'unknown'}`);
          }
          console.log('analysis catalog:',catalog.records.length,'Wave 3:',history.before.length,'→',history.after.length);
          NODE
      - name: Verify Brand and Artist manifests
        run: |
          test -f generated/brands/index.json
          node - <<'NODE'
          const fs=require('fs');
          const catalog=JSON.parse(fs.readFileSync('generated/catalog.json'));
          const index=JSON.parse(fs.readFileSync('generated/brands/index.json'));
          const eligible=catalog.records.filter(r=>r.groupType!=='industry-cluster');
          const expectedBrands=new Set(eligible.map(r=>r.brand));
          if(index.brands.length!==expectedBrands.size)throw new Error(`manifest brand count ${index.brands.length} != ${expectedBrands.size}`);
          const total=index.brands.reduce((sum,b)=>sum+b.patternCount,0);
          if(total!==eligible.length)throw new Error(`manifest pattern count ${total} != ${eligible.length}`);
          for(const entry of index.brands){
            if(!expectedBrands.has(entry.brand))throw new Error(`unexpected brand ${entry.brand}`);
            if(!fs.existsSync(`generated/brands/${entry.file}`))throw new Error(`missing manifest ${entry.file}`);
          }
          console.log('brand / artist manifests:',index.brands.length,'patterns:',total);
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
