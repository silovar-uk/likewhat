name: Reference Source Health

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build reference data
        run: node scripts/build-pattern-data.mjs
      - name: Check source URLs
        run: node scripts/check-sources.mjs
